name: Daily refresh
on:
  schedule: [{cron: "0 11 * * *"}, {cron: "0 12 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 build.py
      - run: |
          git config user.name Brock; git config user.email brock@local
          git add data.json; git commit -m "Daily refresh" || exit 0; git push
