<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Daily Paper</title><style>
body{margin:0;background:#faf8f3;color:#1a1a1a;font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{text-align:center;border-bottom:3px double #1a1a1a;padding-bottom:8px}
h1{font-size:2.4em;margin:.2em 0;letter-spacing:1px}.date{font-size:.9em;color:#555}
nav{text-align:center;padding:8px 0;border-bottom:1px solid #ccc;font-size:.95em}nav a{color:#1a1a1a;margin:0 8px}
h2{font-size:1.4em;border-bottom:2px solid #1a1a1a;margin:28px 0 6px;text-transform:uppercase;letter-spacing:1px}
.it{padding:10px 0;border-bottom:1px solid #ddd}.it a{color:#111;text-decoration:none;font-weight:bold;font-size:1.08em}.it a:hover{text-decoration:underline}
.meta{font-size:.8em;color:#666;margin-top:3px;font-family:Arial,sans-serif}.sum{font-size:.95em;color:#333;margin-top:3px}
footer{font-size:.75em;color:#777;text-align:center;margin:30px 0}
</style></head><body><div class="wrap">
<header><h1>The Daily Paper</h1><div class="date" id="upd">Loading...</div></header>
<nav id="nav"></nav><main id="main"></main>
<footer id="ft"></footer></div><script>
const VER='v1';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sec=(n,items)=>'<section id="'+n.replace(/\W/g,'')+'"><h2>'+esc(n)+'</h2>'+(items.length?items.map(i=>'<div class="it"><a href="'+esc(i.link)+'" target="_blank" rel="noopener">'+esc(i.title)+'</a><div class="meta">'+esc(i.source)+(i.time?' &middot; '+esc(i.time):'')+'</div>'+(i.summary?'<div class="sum">'+esc(i.summary)+'</div>':'')+'</div>').join(''):'<p>Nothing here right now.</p>')+'</section>';
(async()=>{const b='?v='+Date.now();const d=await (await fetch('data.json'+b,{cache:'no-store'})).json();
let x=null;try{x=await (await fetch('x.json'+b,{cache:'no-store'})).json()}catch(e){}
const all=d.sections.slice();if(x)all.splice(1,0,{name:'From X',items:x.items});
document.getElementById('upd').textContent='Updated '+d.updated;
document.getElementById('nav').innerHTML=all.map(s=>'<a href="#'+s.name.replace(/\W/g,'')+'">'+esc(s.name)+'</a>').join('');
document.getElementById('main').innerHTML=all.map(s=>sec(s.name,s.items)).join('');
document.getElementById('ft').textContent='Version '+VER+(x?' · X posts updated '+x.updated:'');})();
</script></body></html>
